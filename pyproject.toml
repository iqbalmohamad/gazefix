[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazefix"
version = "0.1.0"
description = "Local Windows webcam pipeline foundation for GazeFix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
gazefix = "gazefix.main:main"
gazefix-camera-test = "gazefix.camera.diagnostics:main"

[tool.setuptools.packages.find]
include = ["gazefix*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

